name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: windows-2022  # pinned: windows-2025 image 20261116.315.1 ships broken Tcl (init.tcl unreadable)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
