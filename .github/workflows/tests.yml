name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: windows-2022  # pinned: windows-2025 image 20261116.315.1 ships broken Tcl (init.tcl unreadable)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      # Probe-only deps: shape fixtures with the same pipeline the Linux viewer uses.
      - run: pip install arabic-reshaper "python-bidi==0.6.12"
      - run: python -m pytest -q -rs
      # Render real Tk widgets with Arabic/BiDi fixtures and upload the actual
      # pixels: OS-stack shaping/reorder can only be judged visually.
      - run: python tools/render_probe.py
      - name: Surface render metrics as annotation
        if: always()
        shell: bash
        run: python -c "import json; m=json.load(open('render-out/metrics.json')); print('::notice::METRICS '+json.dumps(m,separators=(',',':')))"
      - name: Emit text captures as base64 annotations
        if: always()
        shell: bash
        run: |
          for f in text_ordering_640; do
            [ -f render-out/$f.png ] || { echo "skip $f (missing)"; continue; }
            base64 -w0 render-out/$f.png > "$RUNNER_TEMP/b64.txt"
            N=$(wc -c < "$RUNNER_TEMP/b64.txt")
            CH=$(( (N + 3899) / 3900 ))
            i=0
            while [ $i -lt $CH ]; do
              i=$((i+1))
              SEG=$(tail -c +$(( (i-1)*3900 + 1 )) "$RUNNER_TEMP/b64.txt" | head -c 3900)
              echo "::notice::PNG_${f}_C${i}of${CH} $SEG"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-render
          path: render-out/
          if-no-files-found: warn
      # Also publish captures to the ci-render branch so they are fetchable
      # without an API token (public raw URLs). Tolerated if the token is read-only.
      - name: Publish render captures to ci-render branch
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          git config user.email "ci-render@localhost"
          git config user.name "ci-render"
          git fetch origin ci-render || true
          BASE=$(git rev-parse --verify -q origin/ci-render || git rev-parse HEAD)
          git checkout -B ci-render "$BASE"
          mkdir -p captures/$GITHUB_RUN_ID
          cp -r render-out/* captures/$GITHUB_RUN_ID/ 2>/dev/null || echo "no captures"
          git add captures
          git commit -m "render captures for run $GITHUB_RUN_ID" || echo "nothing to commit"
          PUSH_OUT=$(git push origin ci-render 2>&1 | tr '\n' ' ') || echo "::warning::PUBLISH_FAILED: $PUSH_OUT"
          git checkout -
